name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: full,       make: "make check" }
          - { name: sanitize,   make: "make sanitize" }
          - { name: no-wraster, make: "make check WR_LIBS=" }   # gradients degrade to two colours, no icons
          - { name: no-dbus,    make: "make check DBUS_LIBS=" } # wmnotify is skipped, everything else builds
          - { name: no-xft,     make: "make check XFT_LIBS=" }  # wmnotify/wmfiles skipped
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxft-dev libdbus-1-dev \
            libwraster-dev xvfb dbus libglib2.0-bin fontconfig fonts-dejavu-core
      - name: ${{ matrix.name }}
        run: ${{ matrix.make }}
